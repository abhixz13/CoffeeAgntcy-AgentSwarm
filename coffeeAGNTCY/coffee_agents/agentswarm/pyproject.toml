[project]
name = "agentswarm"
version = "1.0.0"
description = "AgentSwarm - Multi-Agent System for Webex Contact Center"
authors = [{ name = "AgentSwarm Team", email = "rguvvala@cisco.com" }]
requires-python = ">=3.11,<4.0"
dependencies = [
    "a2a-sdk==0.3.0",
    "click>=8.1.8",
    "coloredlogs>=15.0.1",
    "dotenv>=0.9.9",
    "fastapi>=0.115.12",
    "httpx>=0.23.0",
    "langchain>=0.3.27",
    "langchain-openai>=0.3.16",
    "langchain-litellm>=0.3.0",
    "langgraph>=0.4.1",
    "litellm[proxy]==1.75.3",
    "pika>=1.3.0",
    "pydantic>=2.11.4",
    "python-dotenv>=1.1.0",
    "requests",
    "starlette",
    "uvicorn>=0.29.0",
    "ioa-observe-sdk==1.0.24",
    "agntcy-app-sdk==0.4.5",
    # OpenTelemetry for observability
    "opentelemetry-api>=1.22.0",
    "opentelemetry-sdk>=1.22.0",
    "opentelemetry-exporter-otlp-proto-http>=1.22.0",
    "opentelemetry-instrumentation-fastapi>=0.43b0",
    "opentelemetry-instrumentation-httpx>=0.43b0",
    # WebSocket for live dashboard
    "websockets>=12.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=7.0",
    "pytest-asyncio>=0.17.0,<0.18",
]

[tool.hatch.metadata]
allow-direct-references = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"


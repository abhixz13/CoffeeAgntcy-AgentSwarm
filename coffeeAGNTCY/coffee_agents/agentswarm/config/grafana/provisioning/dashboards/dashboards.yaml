# Grafana Dashboard Provisioning for AgentSwarm
apiVersion: 1

providers:
  - name: 'AgentSwarm Dashboards'
    orgId: 1
    folder: 'AgentSwarm'
    folderUid: 'agentswarm'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /etc/grafana/provisioning/dashboards/json

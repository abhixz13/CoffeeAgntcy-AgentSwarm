# AgentSwarm Observability Stack
# Docker Compose for enterprise-grade monitoring
# 
# Usage:
#   docker-compose -f docker-compose.observability.yaml up -d
#
# Services:
#   - Jaeger (Trace Visualization): http://localhost:16686
#   - Grafana (Metrics Dashboard): http://localhost:3001
#   - Prometheus (Metrics Store): http://localhost:9090
#   - OTEL Collector (Telemetry Pipeline): localhost:4317/4318

services:
  # ============================================================
  # JAEGER - Distributed Tracing UI
  # ============================================================
  jaeger:
    image: jaegertracing/all-in-one:1.53
    container_name: agentswarm-jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "14268:14268"  # Accept spans from OTEL
      - "14250:14250"  # gRPC
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    restart: unless-stopped

  # ============================================================
  # OPENTELEMETRY COLLECTOR - Telemetry Pipeline
  # ============================================================
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.92.0
    container_name: agentswarm-otel-collector
    command: ["--config", "/etc/otel-collector-config.yaml"]
    volumes:
      - ./config/otel-collector-config.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC
      - "4318:4318"   # OTLP HTTP
      - "8888:8888"   # Prometheus metrics (self)
      - "8889:8889"   # Prometheus exporter
    depends_on:
      - jaeger
      - prometheus
    restart: unless-stopped

  # ============================================================
  # PROMETHEUS - Metrics Storage
  # ============================================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: agentswarm-prometheus
    volumes:
      - ./config/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    restart: unless-stopped

  # ============================================================
  # GRAFANA - Metrics Visualization
  # ============================================================
  grafana:
    image: grafana/grafana:10.2.3
    container_name: agentswarm-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./config/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    restart: unless-stopped

  # ============================================================
  # REDIS - For caching (optional, future use)
  # ============================================================
  # redis:
  #   image: redis:7-alpine
  #   container_name: agentswarm-redis
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped

volumes:
  prometheus_data:
  grafana_data:

networks:
  default:
    name: agentswarm-network
